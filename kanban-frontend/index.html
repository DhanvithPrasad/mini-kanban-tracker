<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Kanban - Task & Issue Tracker</title>
  </head>
  <body class="bg-slate-100 text-slate-800 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
      <!-- Header & Live Stats -->
      <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Task & Issue Tracker</h1>
          <p class="text-sm text-slate-500">Mini Kanban Board</p>
        </div>
        <div id="statsBar" class="flex flex-wrap gap-3 text-sm font-medium"></div>
      </header>

      <!-- Add New Task Form -->
      <form id="taskForm" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-5 gap-3">
        <input id="titleInput" type="text" placeholder="Task title *" required class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input id="descInput" type="text" placeholder="Description" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <select id="priorityInput" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="Low">Low Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="High">High Priority</option>
        </select>
        <input id="assigneeInput" type="text" placeholder="Assignee *" required class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg px-4 py-2 text-sm transition cursor-pointer">
          + Add Task
        </button>
      </form>

      <!-- Filter Controls -->
      <div class="flex flex-wrap items-center gap-3 mb-6">
        <span class="text-sm font-medium text-slate-600">Filter by:</span>
        <select id="filterPriority" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
          <option value="">All Priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <input id="filterAssignee" type="text" placeholder="Search assignee..." class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
        <button id="clearFilters" type="button" class="text-sm text-blue-600 hover:underline cursor-pointer">Reset</button>
      </div>

      <!-- 3-Column Kanban Board -->
      <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <section class="bg-slate-200/70 p-4 rounded-xl">
          <h2 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
            <span>Todo</span>
            <span id="countTodo" class="text-xs bg-slate-300 px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div id="colTodo" class="space-y-3"></div>
        </section>

        <section class="bg-slate-200/70 p-4 rounded-xl">
          <h2 class="font-semibold text-blue-700 mb-3 flex items-center justify-between">
            <span>In Progress</span>
            <span id="countInProgress" class="text-xs bg-blue-200 text-blue-800 px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div id="colInProgress" class="space-y-3"></div>
        </section>

        <section class="bg-slate-200/70 p-4 rounded-xl">
          <h2 class="font-semibold text-emerald-700 mb-3 flex items-center justify-between">
            <span>Done</span>
            <span id="countDone" class="text-xs bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div id="colDone" class="space-y-3"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
